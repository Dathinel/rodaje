# Integración continua de Rodaje.
# - linux: Core, Packages y Playback, que compilan para net10.0 sin Windows.
# - windows: la solución entera con el entorno propio (.entorno, D-005). Bloquea; sin exclusiones por nombre.
# Las pruebas largas y de hardware solo corren con RODAJE_PRUEBAS_LARGAS=1, que aquí no se pone: esas,
# TiempoReal y Rendimiento las corre nocturna.yml.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  linux:
    name: Linux (Core, Packages, Playback)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/preparar-linux

      # Los lockfiles no dependen del anfitrión ni de «-r win-x64» (NU1004): la solución entera se restaura en
      # Linux con los mismos RID que en Windows, y el módulo de eco igual que lo publica build\app.ps1.
      - name: Lockfiles deterministas
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Rodaje.slnx --locked-mode -p:EnableWindowsTargeting=true
          # Los módulos que se publican con AOT, también con -r win-x64: su lockfile y el de lo que referencian no
          # pueden depender de que se pase el RID. La app, el lanzador y AotSmoke se publican sin -r (lo llevan en el
          # .csproj), porque como propiedad global llegaría a Rodaje.Core y demás bibliotecas y cambiaría sus lockfiles.
          for m in Echo Voice Subtitles AudioAi Vision Raw; do
            dotnet restore "modules/Rodaje.Module.$m/Rodaje.Module.$m.csproj" -r win-x64 --locked-mode -p:EnableWindowsTargeting=true
          done

      # SoloWindows: pruebas que dependen de códigos de error de Windows. TiempoReal y Rendimiento miden contra el
      # reloj de pared y en un runner compartido dan falsos fallos.
      - name: Pruebas
        shell: bash
        run: bash build/pruebas-linux.sh 'Categoria!=SoloWindows&Categoria!=TiempoReal&Categoria!=Rendimiento'

      - name: Resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-linux
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  windows:
    name: Windows (solución completa)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.entorno\nuget
      DOTNET_ROOT: ${{ github.workspace }}\.entorno\dotnet
      DOTNET_CLI_HOME: ${{ github.workspace }}\.entorno
      DOTNET_MULTILEVEL_LOOKUP: '0'
      DOTNET_CLI_FORCE_UTF8_ENCODING: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/preparar-windows

      - name: Publicar AOT para la autoprueba
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build\probar-autoprueba.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $reloj = [System.Diagnostics.Stopwatch]::StartNew()
          powershell -NoProfile -ExecutionPolicy Bypass -File build\app.ps1 -SoloPublicar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build\dotnet-local.cmd publish modules\Rodaje.Module.Echo\Rodaje.Module.Echo.csproj -c Release -o modules\Rodaje.Module.Echo\bin\aot -m:4 --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Publicación AOT: $($reloj.Elapsed.TotalSeconds.ToString('F1')) s" >> $env:GITHUB_STEP_SUMMARY

      - name: Autoprueba de arranque (WARP, ventana lista)
        timeout-minutes: 3
        shell: pwsh
        env:
          RODAJE_FORZAR_WARP: '1'
          RODAJE_DATOS: ${{ github.workspace }}\TestResults\autoprueba-ci
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build\app.ps1 -SinPublicar -Autoprueba
          exit $LASTEXITCODE

      # Sin RODAJE_PRUEBAS_LARGAS las largas y las de hardware se omiten solas (tests/Rodaje.TestMedia/Skip.cs);
      # TiempoReal y Rendimiento se excluyen igual que en Linux. Una prueba colgada se corta a los 10 minutos con su nombre
      # en el registro (--blame-hang), en vez de agotar los 45 del trabajo sin decir cuál era.
      # VSTEST_CONNECTION_TIMEOUT (segundos): dotnet test arranca a la vez un testhost por procesador, y el de
      # Rodaje.App.Tests (el más grande, win-x64) no llegó a conectarse con vstest.console en los 90 s por omisión con los
      # otros tres ya corriendo (13-oct): «Test Run Aborted» sin ejecutar ni una prueba de ese proyecto. No es el
      # --blame-hang (10 min, mide pruebas ya en marcha); con 300 s un arranque lento espera en lugar de abortar.
      - name: Pruebas
        shell: pwsh
        env:
          VSTEST_CONNECTION_TIMEOUT: '300'
        run: |
          $filtro = 'Categoria!=TiempoReal&Categoria!=Rendimiento'
          & .entorno\dotnet\dotnet.exe test Rodaje.slnx --no-build --filter $filtro --logger trx --results-directory TestResults `
            --blame-hang-timeout 10m --blame-hang-dump-type none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-windows
          path: |
            TestResults/**/*.trx
            TestResults/app-*.log
            TestResults/app-arranque.txt
            TestResults/autoprueba-ci/**
            dist/Rodaje/app/rodaje-error.txt
          if-no-files-found: ignore
